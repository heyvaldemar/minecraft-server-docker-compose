name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Findings surface in the Security tab for triage; they don't block CI.
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime — single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: minecraft-server
            env_var: MINECRAFT_SERVER_IMAGE_TAG
          - name: mc-backup
            env_var: MINECRAFT_SERVER_BACKUP_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\\$\\{${ENV_VAR}:-.*" minecraft-server-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  check-pin-freshness:
    name: Check pinned images for upstream drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Scheduled + manual dispatch only: a new upstream release is not
    # actionable inside an unrelated PR. On the cron the failure lands as a
    # workflow-failure notification to the maintainer — a stale pin must
    # not sit unnoticed. Dependabot cannot see these pins (they are compose
    # interpolation defaults, not Dockerfile literals), so this job is the
    # actual tracking mechanism.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned digests against what each tag resolves to now
        run: |
          status=0
          for var in MINECRAFT_SERVER_IMAGE_TAG MINECRAFT_SERVER_BACKUP_IMAGE_TAG; do
            pin="$(grep -m1 -oE "\\\$\\{${var}:-.*" minecraft-server-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
            ref="${pin%%@*}"
            pinned_digest="${pin##*@}"
            # Three attempts: an unanswered registry lookup used to leave this empty,
            # and the comparison below then reported it as drift.
            current_digest=""
            for attempt in 1 2 3; do
              current_digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')"
              [ -n "$current_digest" ] && break
              sleep $(( attempt * 5 ))
            done
            if [ -z "$current_digest" ]; then
              echo "::error::${ref} did not resolve after three attempts: the registry did not answer, or the tag is gone. The pin itself is unchanged."
              status=1
              continue
            fi
            if [ "$pinned_digest" != "$current_digest" ]; then
              echo "::error::${var} digest drift: pinned ${pinned_digest}, but ${ref} now resolves to ${current_digest}"
              status=1
            else
              echo "${var} OK (${ref})"
            fi
          done
          exit "$status"

      - name: Compare pinned image versions against the latest itzg releases
        run: |
          status=0
          check() {
            var="$1"; gh_repo="$2"
            pin="$(grep -m1 -oE "\\\$\\{${var}:-.*" minecraft-server-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
            ref="${pin%%@*}"
            pinned_version="${ref##*:}"
            latest="$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_API_TOKEN" "https://api.github.com/repos/${gh_repo}/releases/latest" | jq -r .tag_name)"
            latest="${latest#v}"
            if [ -z "$latest" ] || [ "$latest" = "null" ]; then
              echo "::error::Could not determine the latest ${gh_repo} release"
              status=1
            elif [ "$pinned_version" != "$latest" ]; then
              echo "::error::${var} is behind: pinned ${pinned_version}, latest ${gh_repo} release is ${latest}"
              status=1
            else
              echo "${var} ${pinned_version} matches the latest ${gh_repo} release"
            fi
          }
          check MINECRAFT_SERVER_IMAGE_TAG itzg/docker-minecraft-server
          check MINECRAFT_SERVER_BACKUP_IMAGE_TAG itzg/docker-mc-backup
          exit "$status"

  deploy-and-test:
    name: docker compose up + RCON + backup smoke
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25
    permissions:
      contents: read

    env:
      DOCKER_COMPOSE_FILE: minecraft-server-docker-compose.yml
      COMPOSE_PROJECT_NAME: minecraft
      NETWORK_ONE: minecraft-server-network

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the Docker network
        run: docker network create "$NETWORK_ONE" || true

      - name: Generate test .env with ephemeral credentials
        # The real .env is gitignored. No *_IMAGE_TAG values on purpose:
        # the compose x-images defaults apply, so CI tests exactly the pins
        # the template ships. EULA=true here accepts the Minecraft EULA for
        # this ephemeral CI run. INITIAL_DELAY is shortened so the backup
        # smoke completes inside the job.
        run: |
          cat > .env <<EOF
          MINECRAFT_SERVER_RCON_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          MINECRAFT_SERVER_EULA=true
          MINECRAFT_SERVER_INITIAL_DELAY=15s
          EOF
          echo "Generated ephemeral .env for CI run"

      - name: Start up services using Docker Compose
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" up -d

      - name: Wait for the Minecraft server to report healthy
        # First boot downloads the Paper server jar and the configured
        # plugins, then boots the world — the built-in mc-health check
        # only passes once the server accepts connections.
        run: |
          echo "Waiting for the minecraft-server healthcheck..."
          # $COMPOSE_PROJECT_NAME and the inspect template are expanded by
          # the inner bash -c / docker, not the outer shell.
          # shellcheck disable=SC2016
          timeout 15m bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" "$(docker ps -qf name=${COMPOSE_PROJECT_NAME}-minecraft-server)")" = "healthy" ]; do
            echo "Still starting..."
            sleep 15
          done'

      - name: Verify RCON answers
        # A successful `list` over RCON proves the server is fully up and
        # the shipped RCON wiring works, not just that the port is open.
        run: |
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" exec -T minecraft-server rcon-cli list

      - name: Verify a backup archive is produced
        run: |
          echo "Waiting for the first backup archive..."
          timeout 5m bash -c 'until ls minecraft-server-data-backups/*.tar.gz >/dev/null 2>&1; do
            echo "Still waiting..."
            sleep 10
          done'
          # shellcheck disable=SC2012
          ls -la minecraft-server-data-backups/ | tail -3

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs

      - name: Shutdown Docker Compose services
        if: always()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" down
