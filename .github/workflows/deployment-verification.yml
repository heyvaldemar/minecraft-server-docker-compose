name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime — single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: minecraft-server
            env_var: MINECRAFT_SERVER_IMAGE_TAG
          - name: mc-backup
            env_var: MINECRAFT_SERVER_BACKUP_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\\$\\{${ENV_VAR}:-.*" minecraft-server-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # FINDINGS DO NOT FAIL THIS STEP; A SCAN THAT CANNOT FINISH DOES.
          # Stated here rather than left to the action's default, because
          # this job no longer carries continue-on-error and the difference
          # now decides whether a red run means a new CVE upstream or a
          # scanner that died before it could report one.
          exit-code: "0"

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  deploy-and-test:
    name: docker compose up + RCON + backup smoke
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 35
    permissions:
      contents: read

    env:
      DOCKER_COMPOSE_FILE: minecraft-server-docker-compose.yml
      COMPOSE_PROJECT_NAME: minecraft
      NETWORK_ONE: minecraft-server-network

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the Docker network
        run: docker network create "$NETWORK_ONE" || true

      - name: Generate test .env with ephemeral credentials
        # The real .env is gitignored. No *_IMAGE_TAG values on purpose:
        # the compose x-images defaults apply, so CI tests exactly the pins
        # the template ships. EULA=true here accepts the Minecraft EULA for
        # this ephemeral CI run. INITIAL_DELAY is shortened so the backup
        # smoke completes inside the job.
        run: |
          cat > .env <<EOF
          MINECRAFT_SERVER_RCON_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          MINECRAFT_SERVER_EULA=true
          MINECRAFT_SERVER_INITIAL_DELAY=15s
          MINECRAFT_SERVER_BACKUP_INTERVAL=60s
          EOF
          echo "Generated ephemeral .env for CI run"

      - name: Upgrade drill — the previous release comes up first, on the volumes this run will upgrade
        # A fresh stack proves the new image starts. It proves nothing about the
        # data a deployed host already has: whether the new database image accepts
        # the old data directory, whether the application's migrations run on a
        # populated schema. So the previous release is started first, on this
        # project's volumes, and the ordinary `up -d` below then recreates the
        # changed containers on top of it - which is exactly what `git pull &&
        # docker compose up -d` does on a deployed host. Every smoke check that
        # follows judges the upgraded stack, not a fresh one.
        run: |
          prev="$(git ls-remote --tags --sort=-v:refname origin 'v*' | grep -v '\^{}' | head -1 | sed 's|.*refs/tags/||')"
          if [ -z "$prev" ]; then
            echo "no previous release: nothing to upgrade from, the fresh start below is the whole test"
            exit 0
          fi
          git fetch --depth=1 --quiet origin "refs/tags/$prev:refs/tags/$prev"
          if git diff --quiet "$prev" -- "$DOCKER_COMPOSE_FILE"; then
            echo "the compose file is unchanged since $prev: nothing to drill"
            exit 0
          fi
          git show "$prev:$DOCKER_COMPOSE_FILE" > .upgrade-drill-previous.yml
          echo "starting $prev on this project's volumes"
          docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" up -d
          # Healthy means: every container is running and healthy (or running
          # with no health check), or exited 0 (a one-shot init container).
          bad=""
          for _ in $(seq 1 60); do
            bad="$(docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" ps -a --format json \
              | jq -rs '[.[] | select((.State == "running" and (.Health == "" or .Health == "healthy")) or (.State == "exited" and .ExitCode == 0) | not)] | map("\(.Service):\(.State)/\(.Health)") | join(" ")')"
            [ -z "$bad" ] && break
            sleep 10
          done
          if [ -n "$bad" ]; then
            echo "::error::the previous release ($prev) did not come up with this run's .env: $bad. Either the variable contract changed - then the changelog must say so - or $prev was never green here."
            docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" logs --tail 80
            exit 1
          fi
          echo "$prev is up and healthy; stopping it and keeping its volumes"
          docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" down
          rm -f .upgrade-drill-previous.yml
          echo "the start below is now an upgrade from $prev"

      - name: Start up services using Docker Compose
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" up -d

      - name: Wait for the Minecraft server to report healthy
        # First boot downloads the Paper server jar and the configured
        # plugins, then boots the world — the built-in mc-health check
        # only passes once the server accepts connections.
        run: |
          echo "Waiting for the minecraft-server healthcheck..."
          # $COMPOSE_PROJECT_NAME and the inspect template are expanded by
          # the inner bash -c / docker, not the outer shell.
          # shellcheck disable=SC2016
          timeout 15m bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" "$(docker ps -qf name=${COMPOSE_PROJECT_NAME}-minecraft-server)")" = "healthy" ]; do
            echo "Still starting..."
            sleep 15
          done'

      - name: Verify RCON answers
        # A successful `list` over RCON proves the server is fully up and
        # the shipped RCON wiring works, not just that the port is open.
        run: |
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" exec -T minecraft-server rcon-cli list

      - name: Verify a backup archive is produced
        run: |
          echo "Waiting for the first backup archive..."
          timeout 5m bash -c 'until ls minecraft-server-data-backups/*.tar.gz >/dev/null 2>&1; do
            echo "Still waiting..."
            sleep 10
          done'
          # shellcheck disable=SC2012
          ls -la minecraft-server-data-backups/ | tail -3

      - name: Run the backup and restore end-to-end tests
        # Nine scenarios against the live stack. The one that matters is the
        # flush: before each archive the sidecar tells the server over RCON to
        # stop writing and flush. Measured against a sidecar given a wrong
        # password, itzg/mc-backup retries five times, never archives without a
        # successful flush, and exits 2 — which under restart: unless-stopped
        # becomes a restart loop producing no backups at all, while everything
        # in `docker compose ps` looks ordinary.
        run: |
          chmod +x tests/e2e-backup-restore.sh
          ./tests/e2e-backup-restore.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs

      - name: Shutdown Docker Compose services
        if: always()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" down

  plugins:
    name: Do the pinned plugins exist for the version this would run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scheduled and manual only. VERSION defaults to LATEST, so the answer
    # changes when Mojang publishes rather than when anybody commits here —
    # which is exactly why a pull request is the wrong place to ask it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ask Modrinth before a world is converted, not after
        # A Minecraft release always outpaces its plugin ecosystem. The server
        # takes the new version the moment it appears, fails to resolve plugins
        # that have no build for it yet, and exits during resolution — in a
        # loop, with its version already bumped and its backup already taken.
        run: |
          chmod +x tools/plugins-for-version.sh
          ./tools/plugins-for-version.sh
